[project]
name = "footprint-recon"
version = "0.1.0"
description = "Self-OSINT digital footprint assessment tool"
requires-python = ">=3.11"
dependencies = [
    "httpx (>=0.27,<1.0)",
    "pydantic (>=2.0,<3.0)",
    "rich (>=13.0,<14.0)",
]

[tool.poetry]
packages = [{ include = "footprint_recon", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
